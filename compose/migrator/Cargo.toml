[package]
name = "migrator"
version = "1.0.0"
edition = "2021"
author = "Jonas H"

[dependencies]
chrono = {version="0.4.40", features = [ "serde"]}
dotenv = "0.15.0"
env_logger = "0.11.6"
features = "0.10.0"
log = "0.4.25"
mysql = "26.0.0"
postgres = "0.19.10"
reqwest = { version = "0.12.12", features = ["json", "blocking"] }
serde = "1.0.217"
serde_json = "1.0.138"
sqlx = { version = "0.8", features = [ "chrono", "mysql", "postgres", "runtime-tokio" ] }
tokio = { version = "1.44.0", features = ["rt", "rt-multi-thread"] }
