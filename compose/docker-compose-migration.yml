# The purpose of this setup is to test if the original hapi fhir may run perfectly fine using a postgres databse
# Due to a migration from mariadb to postgres it is required to know if we may replace the old mariadb with postgres
# in order to migrate the data before upgrading the hapi fhir server
networks:
  hjemmebehandling:
    driver: bridge

services:


############################ WEB ############################

############################ Postgres ############################
  medarbejder-web-postgres:
    container_name: medarbejder-web-postgres
    image: kvalitetsit/hjemmebehandling-medarbejder-web:800cd1c6cd4a6694277d77264f270d53b83c88c3
    restart: always
    environment:
     - REACT_APP_BFF_BASE_URL=http://medarbejder-bff-postgres:8080
     - REACT_APP_NODE_ENV=dev
     - REACT_APP_KEYCLOAK_URL=https://keycloak.sdn.t0.hosting.kitkube.dk/auth
     - REACT_APP_KEYCLOAK_REALM=aftaleportal-test
     - REACT_APP_KEYCLOAK_CLIENTID=aftaleportal-ui
    ports:
     - "4002:80"
    networks:
      - hjemmebehandling

  patient-web-postgres: 
    container_name: patient-web-postgres
    image: kvalitetsit/hjemmebehandling-patient-web:6204cae5f940f90ccc572e03cac07b68f854d903
    restart: always
    environment:
      - REACT_APP_BFF_BASE_URL=http://patient-bff-postgres:8080
      - REACT_APP_NODE_ENV=dev
      - REACT_APP_KEYCLOAK_URL=https://keycloak.sdn.t0.hosting.kitkube.dk/auth
      - REACT_APP_KEYCLOAK_REALM=aftaleportal-test
      - REACT_APP_KEYCLOAK_CLIENTID=aftaleportal-ui
    networks:
      - hjemmebehandling
    ports:
      - "3002:80"

############################ MariaDB ############################

  medarbejder-web-mariadb:
    container_name: medarbejder-web-mariadb
    image: kvalitetsit/hjemmebehandling-medarbejder-web:3.0.1-2024-03-19
    restart: always
    environment:
     - REACT_APP_BFF_BASE_URL=http://medarbejder-bff-mariadb:8080
     - REACT_APP_NODE_ENV=dev
     - REACT_APP_KEYCLOAK_URL=https://keycloak.sdn.t0.hosting.kitkube.dk/auth
     - REACT_APP_KEYCLOAK_REALM=aftaleportal-test
     - REACT_APP_KEYCLOAK_CLIENTID=aftaleportal-ui
    ports:
     - "4001:80"
    networks:
      - hjemmebehandling
  
  patient-web-mariadb: 
    container_name: patient-web-mariadb
    image: kvalitetsit/hjemmebehandling-patient-web:3.0.1-2024-03-19
    restart: always
    environment:
      - REACT_APP_BFF_BASE_URL=http://patient-bff-mariadb:8080
      - REACT_APP_NODE_ENV=dev
      - REACT_APP_KEYCLOAK_URL=https://keycloak.sdn.t0.hosting.kitkube.dk/auth
      - REACT_APP_KEYCLOAK_REALM=aftaleportal-test
      - REACT_APP_KEYCLOAK_CLIENTID=aftaleportal-ui
    networks:
      - hjemmebehandling
    ports:
      - "3001:80"

 
############################ BFF ############################

############################ Postgres ############################


  medarbejder-bff-postgres:
    container_name: medarbejder-bff-postgres
    image: kvalitetsit/hjemmebehandling-medarbejder-bff:84f1eeb873de13bbb2fe531a918e0113ce020d67
    environment:
      - userattributes_role_key=DIAS_HJEMMEBEHANDLING_Sygeplejerske2
      - user.context.handler=MOCK
      - user.mock.context.organization.id=271231000016008
      - user.mock.context.entitlements=DIAS_KoMo_Laege,DIAS_KoMo_Sygeplejerske,DIAS_KoMo_Administrator, Administrator, DIAS_HJEMMEBEHANDLING_Sygeplejerske2 
      - cpr.url=http://rm-cpr-service:8080/Patient/
      - fhir.server.url=http://hapi-server-postgres:8080/fhir
      - allowed_origins=http://localhost:4002
      - JVM_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006
      - allowed.roles=DIAS_KoMo_Laege,DIAS_KoMo_Sygeplejerske,DIAS_KoMo_Administrator, Administrator, DIAS_HJEMMEBEHANDLING_Sygeplejerske2
      - allowed.admin.roles=Administrator,DIAS_KoMo_Administrator, Administrator, DIAS_HJEMMEBEHANDLING_Sygeplejerske2
    ports:
      - 8002:8080
      - 5009:5006
    networks:
      - hjemmebehandling

  patient-bff-postgres:
    container_name: patient-bff-postgres
    image: kvalitetsit/hjemmebehandling-patient-bff:cedb407d23559bd2e5eb1661913d98064ee5306b
    environment:
      - user.mock.context.cpr=0104909995
      - cpr.url=http://rm-cpr-service:8080/Patient/
      - fhir.server.url=http://hapi-server-postgres:8080/fhir
      - user.context.handler=MOCK
      - allowed_origins=http://localhost:3002
      - JVM_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5007
      - allowed.roles=DIAS_KoMo_Laege,DIAS_KoMo_Sygeplejerske,DIAS_KoMo_Administrator, DIAS_HJEMMEBEHANDLING_Sygeplejerske2
      - allowed.admin.roles=Administrator,DIAS_KoMo_Administrator 
    ports:
      - 7002:8080
      - 5007:5006
    networks:
      - hjemmebehandling

############################ Mariadb ############################

  medarbejder-bff-mariadb:
    container_name: medarbejder-bff-mariadb
    image: kvalitetsit/hjemmebehandling-medarbejder-bff:3.0.1-2024-03-19
    environment:
      - userattributes_role_key=DIAS_HJEMMEBEHANDLING_Sygeplejerske2
      - user.context.handler=MOCK
      - user.mock.context.organization.id=271231000016008
      - user.mock.context.entitlements=DIAS_KoMo_Laege,DIAS_KoMo_Sygeplejerske,DIAS_KoMo_Administrator, Administrator, DIAS_HJEMMEBEHANDLING_Sygeplejerske2 
      - cpr.url=http://rm-cpr-service:8080/Patient/
      - fhir.server.url=http://hapi-server-mariadb:8080/fhir
      - allowed_origins=http://localhost:4001
      - JVM_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006
      - allowed.roles=DIAS_KoMo_Laege,DIAS_KoMo_Sygeplejerske,DIAS_KoMo_Administrator, Administrator, DIAS_HJEMMEBEHANDLING_Sygeplejerske2
      - allowed.admin.roles=Administrator,DIAS_KoMo_Administrator, Administrator, DIAS_HJEMMEBEHANDLING_Sygeplejerske2
    ports:
      - 8001:8080
      - 5006:5006
    networks:
      - hjemmebehandling

  patient-bff-mariadb:
    container_name: patient-bff-mariadb
    image: kvalitetsit/hjemmebehandling-patient-bff:3be4e9beb8bba1f4e7bd073aa30962bf7b47d43c
    environment:
      - user.mock.context.cpr=0104909995
      - cpr.url=http://rm-cpr-service:8080/Patient/
      - fhir.server.url=http://hapi-server-mariadb:8080/fhir
      - user.context.handler=MOCK
      - allowed_origins=http://localhost:3001
      - JVM_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5007
      - allowed.roles=DIAS_KoMo_Laege,DIAS_KoMo_Sygeplejerske,DIAS_KoMo_Administrator, DIAS_HJEMMEBEHANDLING_Sygeplejerske2
      - allowed.admin.roles=Administrator,DIAS_KoMo_Administrator 
    ports:
      - 7001:8080
      - 5008:5006
    networks:
      - hjemmebehandling
 
############################ Infrastructure ############################
  
  rm-cpr-service:
    image: kvalitetsit/rm-cpr-service:0.2.0
    environment:
      - CPR_ENDPOINT=http://rm-cpr-service-mock:8080
      - DEBUG_LOGGING=true
    networks:
      - hjemmebehandling
    ports:
      - "8081:8080"

  rm-cpr-service-mock:
    image: kvalitetsit/rm-cpr-service-mock-backend:0.2.0
    environment:
      - DEBUG_LOGGING=true
    networks:
      - hjemmebehandling

      
  hapi-server-initializer:
    image: alpine:3.11.5
    container_name: initializer
    environment:
      -  hapi_server_base_url=http://hapi-server-mariadb:8080
    depends_on:
      hapi-server-mariadb:
        condition: service_healthy
    working_dir: /hapi-server-initializer
    volumes:
      - ./hapi-server-initializer:/hapi-server-initializer
    command: "./init-infektionsmedicinsk.sh"
    networks:
      - hjemmebehandling


  hapi-server-migrator:
    image: kvalitetsit/hjemmebehandling-migrator:1.0.25
    container_name: migrator
    environment:
      # Note: The resources below has to be in a certain order
      - RESOURCES=CodeSystem,Practitioner,SearchParameter,Organization,ValueSet,Patient,Questionnaire,PlanDefinition,CarePlan,QuestionnaireResponse
      - ORIGIN=http://hapi-server-mariadb:8080
      - SUCCESSOR=http://hapi-server-postgres:8080
      - RUST_LOG=Info
      - WAIT=20
      - MARIADB_USER=hapi
      - MARIADB_PASSWORD=hapi
      - MARIADB_DB=hapi
      - MARIADB_HOST=mariadb
      - MARIADB_PORT=3306
      - POSTGRES_USER=hapi
      - POSTGRES_PASSWORD=hapi
      - POSTGRES_DB=hapi
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - RUST_BACKTRACE=1
      - ISTIO_PORT=15020
      - ISTIO_HOST=localhost
    depends_on:
      hapi-server-initializer:
        condition: service_completed_successfully
    volumes:
      - ./migrator/data:/data
    networks:
      - hjemmebehandling
  

################ MariaDB ################
      
  hapi-server-mariadb:
    image: kvalitetsit/hjemmebehandling-hapi-fhir-server:b2ade7c4e2654c7936a9475ad9ca9fa8550268be
    container_name: hapi-server-mariadb
    environment:
      - spring.datasource.url=jdbc:mysql://mariadb:3306/hapi
      - spring.datasource.driverClassName=com.mysql.jdbc.Driver
      - spring.datasource.username=hapi
      - spring.datasource.password=hapi
    depends_on:
      - mariadb
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/fhir/metadata" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - hjemmebehandling
    ports:
      - "9001:8080"

  mariadb:
    container_name: mariadb
    image: mariadb:10.7
    environment:
      - MARIADB_USER=hapi
      - MARIADB_PASSWORD=hapi
      - MARIADB_ROOT_PASSWORD=hapi
      - MARIADB_DATABASE=hapi
    ports:
      - 3306:3306
    networks:
      - hjemmebehandling


################ Postgres ################

  hapi-server-postgres:
    container_name: hapi-server-postgres
    image: kvalitetsit/hjemmebehandling-hapi-fhir-server:567ab2b2bd3edddf06b66c3a5c7d322662681907
    environment:
      - spring.datasource.url=jdbc:postgresql://postgres:5432/hapi
      - spring.datasource.driverClassName=org.postgresql.Driver
      - spring.datasource.username=hapi
      - spring.datasource.password=hapi
    depends_on:
      - postgres
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/fhir/metadata" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - hjemmebehandling
    ports:
      - "9002:8080"

  postgres:
    container_name: postgres
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=hapi
      - POSTGRES_PASSWORD=hapi
      - POSTGRES_ROOT_PASSWORD=hapi
      - POSTGRES_DATABASE=hapi
    ports:
      - 5432:5432      
    networks:
      - hjemmebehandling
