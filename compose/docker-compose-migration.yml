# The purpose of this setup is to test if the original hapi fhir may run perfectly fine using a postgres databse
# Due to a migration from mariadb to postgres it is required to know if we may replace the old mariadb with postgres
# in order to migrate the data before upgrading the hapi fhir server

networks:
  hjemmebehandling:
    driver: bridge

services:
  rm-cpr-service:
    image: kvalitetsit/rm-cpr-service:0.2.0
    environment:
      - CPR_ENDPOINT=http://rm-cpr-service-mock:8080
      - DEBUG_LOGGING=true
    networks:
      - hjemmebehandling
    ports:
      - "8081:8080"

  rm-cpr-service-mock:
    image: kvalitetsit/rm-cpr-service-mock-backend:0.2.0
    environment:
      - DEBUG_LOGGING=true
    networks:
      - hjemmebehandling

  medarbejder-bff:
    image: kvalitetsit/hjemmebehandling-medarbejder-bff:dev
    environment:
      - userattributes_role_key=DIAS_HJEMMEBEHANDLING_Sygeplejerske2
      - user.context.handler=MOCK
      - user.mock.context.organization.id=271231000016008
      - user.mock.context.entitlements=DIAS_KoMo_Laege,DIAS_KoMo_Sygeplejerske,DIAS_KoMo_Administrator, Administrator, DIAS_HJEMMEBEHANDLING_Sygeplejerske2 
      - cpr.url=http://rm-cpr-service:8080/Patient/
      - fhir.server.url=http://hapi-server-postgres:8080/fhir
      - allowed_origins=http://localhost:3000
      - JVM_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006
      - allowed.roles=DIAS_KoMo_Laege,DIAS_KoMo_Sygeplejerske,DIAS_KoMo_Administrator, Administrator, DIAS_HJEMMEBEHANDLING_Sygeplejerske2
      - allowed.admin.roles=Administrator,DIAS_KoMo_Administrator, Administrator, DIAS_HJEMMEBEHANDLING_Sygeplejerske2
    ports:
      - 8092:8080
      - 5006:5006
    networks:
      - hjemmebehandling


  medarbejder-web:
    image: kvalitetsit/hjemmebehandling-medarbejder-web:dev
    restart: always
    environment:
     - REACT_APP_BFF_BASE_URL=http://medarbejder-bff:8080
     - REACT_APP_NODE_ENV=dev
     - REACT_APP_KEYCLOAK_URL=https://keycloak.sdn.t0.hosting.kitkube.dk/auth
     - REACT_APP_KEYCLOAK_REALM=aftaleportal-test
     - REACT_APP_KEYCLOAK_CLIENTID=aftaleportal-ui
    ports:
     - "3000:80"
    networks:
      - hjemmebehandling


  patient-bff:
    image: kvalitetsit/hjemmebehandling-patient-bff:dev
    environment:
      - user.mock.context.cpr=0104909995
      - cpr.url=http://rm-cpr-service:8080/Patient/
      - fhir.server.url=http://hapi-server-postgres:8080/fhir
      - user.context.handler=MOCK
      - allowed_origins=http://localhost:3001
      - JVM_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5007
      - allowed.roles=DIAS_KoMo_Laege,DIAS_KoMo_Sygeplejerske,DIAS_KoMo_Administrator, DIAS_HJEMMEBEHANDLING_Sygeplejerske2
      - allowed.admin.roles=Administrator,DIAS_KoMo_Administrator 
    ports:
      - 8091:8080
      - 5007:5007
    networks:
      - hjemmebehandling


  patient-web: 
    image: kvalitetsit/hjemmebehandling-patient-web:dev
    restart: always
    environment:
      - REACT_APP_BFF_BASE_URL=http://patient-bff:8080
      - REACT_APP_NODE_ENV=dev
      - REACT_APP_KEYCLOAK_URL=https://keycloak.sdn.t0.hosting.kitkube.dk/auth
      - REACT_APP_KEYCLOAK_REALM=aftaleportal-test
      - REACT_APP_KEYCLOAK_CLIENTID=aftaleportal-ui
    networks:
      - hjemmebehandling
    ports:
      - "3001:80"


  hapi-server-initializer:
    image: alpine:3.11.5
    container_name: initializer
    environment:
      -  hapi_server_base_url=http://hapi-server-mariadb:8080
    depends_on:
      hapi-server-mariadb:
        condition: service_healthy
    working_dir: /hapi-server-initializer
    volumes:
      - ./hapi-server-initializer:/hapi-server-initializer
    command: "./init-infektionsmedicinsk.sh"
    networks:
      - hjemmebehandling


  hapi-server-migrator:
    build:
      dockerfile: Dockerfile
      context: ./migrator
    container_name: migrator
    environment:
      # Note: The resources below has to be in a certain order
      - resources=CodeSystem,Practitioner,SearchParameter,ValueSet,Patient,Questionnaire,PlanDefinition,CarePlan,QuestionnaireResponse,Organization
      - origin=http://hapi-server-mariadb:8080
      - successor=http://hapi-server-postgres:8080
      - RUST_LOG=Debug
    depends_on:
      hapi-server-initializer:
        condition: service_completed_successfully
    volumes:
      - ./hapi-server-migrator:/hapi-server-migrator
    networks:
      - hjemmebehandling

################ MariaDB ################
      
  hapi-server-mariadb:
    image: kvalitetsit/hjemmebehandling-hapi-fhir-server:mariadb
    container_name: hapi-server-mariadb
    environment:
      - spring.datasource.url=jdbc:mysql://mariadb:3306/hapi
      - spring.datasource.driverClassName=com.mysql.jdbc.Driver
      - spring.datasource.username=hapi
      - spring.datasource.password=hapi
    depends_on:
      - mariadb
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/fhir/metadata" ]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - hjemmebehandling
    ports:
      - "9090:8080"

  mariadb:
    container_name: mariadb
    image: mariadb:10.7
    environment:
      - MARIADB_USER=hapi
      - MARIADB_PASSWORD=hapi
      - MARIADB_ROOT_PASSWORD=hapi
      - MARIADB_DATABASE=hapi
    networks:
      - hjemmebehandling


################ Postgres ################


  hapi-server-postgres:
    container_name: hapi-server-postgres
    image: kvalitetsit/hjemmebehandling-hapi-fhir-server:postgres
    environment:
      - spring.datasource.url=jdbc:postgresql://postgres:5432/hapi
      - spring.datasource.driverClassName=org.postgresql.Driver
      - spring.datasource.username=hapi
      - spring.datasource.password=hapi
    depends_on:
      - postgres
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/fhir/metadata" ]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - hjemmebehandling
    ports:
      - "9091:8080"

  postgres:
    container_name: postgres
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=hapi
      - POSTGRES_PASSWORD=hapi
      - POSTGRES_ROOT_PASSWORD=hapi
      - POSTGRES_DATABASE=hapi
    ports:
      - 5432:5432      
    networks:
      - hjemmebehandling
